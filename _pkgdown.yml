url: https://lightson.saketlab.org

development:
  mode: auto

template:
  bootstrap: 5
  light-switch: true
  preset: default
  bslib:
    primary: "#c07828"
    secondary: "#6b7689"
    body-bg: "#f8f7f9"
    body-color: "#171923"
    border-color: "#dcdae0"
    border-radius: "6px"
    font-size-base: "1rem"
    headings-font-weight: "700"
    base_font: {google: "Albert Sans"}
    heading_font: {google: "Albert Sans"}
    code_font: {google: "JetBrains Mono"}
  includes:
    in_header: |
      <script>
        (function(){
          var stored = localStorage.getItem('bs-color-scheme');
          if (!stored) {
            stored = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-bs-theme', stored);
        })();
      </script>
      <meta name="description" content="Download VIIRS and Bhuvan nighttime lights rasters in R, extract zonal statistics over any sf geometry, and get tidy panel output for econometrics.">
      <meta name="keywords" content="nighttime lights, NTL, VIIRS, Black Marble, VNP46A4, Bhuvan, ISRO, R package, zonal statistics, radiance, remote sensing, panel data, electrification, India">
      <meta name="author" content="Saket Choudhary">
      <meta name="robots" content="index, follow">
      <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
      <link rel="canonical" href="https://lightson.saketlab.org/">
      <meta property="og:type" content="website">
      <meta property="og:url" content="https://lightson.saketlab.org/">
      <meta property="og:title" content="lightson: nighttime lights data for R">
      <meta property="og:description" content="Download VIIRS and Bhuvan NTL rasters, extract zonal stats over sf geometries, get tidy panel output.">
      <meta property="og:site_name" content="lightson">
      <meta property="og:locale" content="en_US">
      <meta name="twitter:card" content="summary_large_image">
      <meta name="twitter:title" content="lightson: nighttime lights data for R">
      <meta name="twitter:description" content="VIIRS + Bhuvan nighttime lights in R. Zonal stats over any sf geometry, tidy panel output, trend plots.">
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "lightson",
            "url": "https://lightson.saketlab.org/",
            "inLanguage": "en-US"
          },
          {
            "@type": "SoftwareSourceCode",
            "name": "lightson",
            "description": "R package for downloading VIIRS/Black Marble (VNP46A4) and Bhuvan NTL rasters, extracting zonal statistics over sf geometries, and producing tidy panel output.",
            "codeRepository": "https://github.com/saketlab/lightson",
            "programmingLanguage": "R",
            "runtimePlatform": "R >= 4.1.0",
            "license": "https://opensource.org/licenses/MIT",
            "version": "0.1.0",
            "author": {
              "@type": "Person",
              "name": "Saket Choudhary",
              "url": "https://saketlab.org",
              "sameAs": "https://orcid.org/0000-0001-5202-7633"
            },
            "datePublished": "2025-01-01",
            "operatingSystem": "Windows, macOS, Linux"
          },
          {
            "@type": "Dataset",
            "name": "VIIRS and Bhuvan nighttime lights for India",
            "description": "Annual nighttime lights composites from NASA VIIRS/Black Marble and ISRO Bhuvan, extracted as zonal statistics over administrative or custom sf geometries.",
            "url": "https://lightson.saketlab.org/",
            "license": "https://opensource.org/licenses/MIT",
            "spatialCoverage": {
              "@type": "Place",
              "name": "India"
            },
            "variableMeasured": [
              "Mean radiance (nW/cm²/sr)",
              "Sum of lights",
              "Lit area fraction"
            ],
            "distribution": {
              "@type": "DataDownload",
              "encodingFormat": "image/tiff",
              "contentUrl": "https://github.com/saketlab/lightson"
            },
            "creator": {
              "@type": "Person",
              "name": "Saket Choudhary",
              "url": "https://saketlab.org"
            }
          }
        ]
      }
      </script>

home:
  title: "lightson: nighttime lights data for R"
  description: >
    Download VIIRS/Black Marble and Bhuvan NTL rasters, extract zonal
    statistics over any sf geometry, and get tidy panel output ready for
    econometrics.

  links:
  - text: Browse source code
    href: https://github.com/saketlab/lightson
  - text: Report a bug
    href: https://github.com/saketlab/lightson/issues

navbar:
  structure:
    left:  [intro, reference, articles]
    right: [search, github, lightswitch]

  components:
    reference:
      text: Reference
      href: reference/index.html

    articles:
      text: Articles
      menu:
      - text: "State-level NTL with Bhuvan"
        href: articles/india-bhuvan-states.html
      - text: "India electrification trends with VIIRS"
        href: articles/india-electrification.html
      - text: "Custom geometry: district-level NTL"
        href: articles/custom-geometry.html

    github:
      icon: fab fa-github fa-lg
      href: https://github.com/saketlab/lightson
      aria-label: GitHub

reference:
- title: "Download"
  desc: "Fetch nighttime lights rasters from remote sources"
  contents:
  - ntl_download
  - bhuvan_raster
  - bhuvan_stats

- title: "Analysis"
  desc: "Compute zonal statistics over spatial polygons"
  contents:
  - extract_panel

- title: "Visualisation"
  desc: "Plot trends and maps"
  contents:
  - plot_ntl_trend
  - plot_ntl_map
  - plot_ntl_panel
  - theme_ntl

- title: "Boundaries"
  desc: "Indian administrative boundaries"
  contents:
  - get_india_admin

- title: "Auth & Cache"
  desc: "Authentication and local cache management"
  contents:
  - earthdata_token
  - cache_clear

authors:
  Saket Choudhary:
    href: https://github.com/saketlab

footer:
  structure:
    left: developed_by
    right: built_with
  components:
    developed_by: "Developed by [Saket Choudhary](https://saketlab.org)"
    built_with: "Built with [pkgdown](https://pkgdown.r-lib.org/)"
